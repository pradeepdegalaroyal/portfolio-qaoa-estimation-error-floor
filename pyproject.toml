[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqfloor"
version = "0.1.0"
description = "Estimation-error floor for QAOA cardinality-constrained portfolio selection"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
